---
name: Prek Validation

on:
  push:
    branches:
      - master
      - automated-sync
    paths:
      - 'definitions/**/*.yml'
      - 'definitions/**/*.yaml'
      - 'definitions/**/prek.toml'
      - 'prek.toml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'ruff.toml'
      - '.yamllint'
      - '.github/workflows/prek-validation.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'definitions/**/*.yml'
      - 'definitions/**/*.yaml'
      - 'definitions/**/prek.toml'
      - 'prek.toml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'ruff.toml'
      - '.yamllint'
      - '.github/workflows/prek-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          prek-version: '0.4.0'
